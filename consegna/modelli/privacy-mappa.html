
    <h2>Mappa</h2>
    <p>La mappa di Google Maps non viene caricata automaticamente: compare solo se premi
    "Mostra la mappa". Da quel momento il servizio è fornito da Google, che può raccogliere dati e
    impostare cookie propri secondo la sua informativa
    (<a href="https://policies.google.com/privacy?hl=it" rel="noopener">policies.google.com/privacy</a>).</p>
